# ── 状态：唯一权威词表（审计 S-1 / S-2 的对症设计）──────────────
# 此前 DOC_LIFECYCLE 用中文名、SQL 过滤用字母码，两套互不映射；
# 且 'D' 同时被划入 pending 与 rejected。这里统一为规范码。
states:
  "NONEXISTENT": {zh: 不存在,   field: null,             value: null, terminal: false}
  "Z:暂存":      {zh: 暂存,     field: FDocumentStatus,  value: Z,    terminal: false}
  "A:创建":      {zh: 创建,     field: FDocumentStatus,  value: A,    terminal: false}
  "B:审核中":    {zh: 审核中,   field: FDocumentStatus,  value: B,    terminal: false}
  "C:已审核":    {zh: 已审核,   field: FDocumentStatus,  value: C,    terminal: true}
  "D:重新审核":  {zh: 重新审核, field: FDocumentStatus,  value: D,    terminal: false}
  "CLOSED":      {zh: 已关闭,   field: FCloseStatus,     value: null, terminal: false}
  "VOID":        {zh: 已作废,   field: FCancelStatus,    value: null, terminal: true}
  "DELETED":     {zh: 已删除,   field: null,             value: null, terminal: true}
  "ENABLED":     {zh: 已启用,   field: FForbidStatus,    value: A,    terminal: false}
  "FORBIDDEN":   {zh: 已禁用,   field: FForbidStatus,    value: B,    terminal: false}

# 状态语义分组：修正 S-2（'D' 曾同时属于 pending 与 rejected 两个互斥类）
state_groups:
  pending:  ["A:创建", "B:审核中", "D:重新审核"]   # 待处理：含被打回需重新审核的
  approved: ["C:已审核"]
  draft:    ["Z:暂存"]
  # rejected 不是单据状态——工作流驳回要查审批实例，不能用 FDocumentStatus 表达。
  # 旧代码把 rejected 定义为 D，与 pending 重叠，任何基于它的统计都不可信。
  rejected: null

# ── 链接：可校验的下推关系表（审计 L-1 / MISS-02 的对症设计）─────
# verified: confirmed（已实证）| documented（仅文档记载）| suspect（存疑，见 links.yml L-2）
links:
  - {from: SAL_SaleOrder,     to: SAL_OUTSTOCK,      zh: 销售订单→销售出库单,   verified: documented}
  - {from: SAL_SaleOrder,     to: SAL_RETURNSTOCK,   zh: 销售订单→销售退货单,   verified: documented}
  - {from: SAL_SaleOrder,     to: TRNV_Receipt,      zh: 销售订单→收款单(二开), verified: documented}
  - {from: PUR_PurchaseOrder, to: STK_InStock,       zh: 采购订单→采购入库单,   verified: documented}
  - {from: PUR_PurchaseOrder, to: PUR_ReceiveBill,   zh: 采购订单→收料通知单,   verified: documented}
  - {from: PUR_PurchaseOrder, to: TRNV_PaymentSlip,  zh: 采购订单→付款单(二开), verified: documented}
  - {from: STK_TransferApply, to: STK_TransferDirect, zh: 调拨申请单→直接调拨单, verified: documented}
  - {from: PRD_MO,            to: PRD_PickMtrl,      zh: 生产订单→生产领料单,   verified: documented}
  - {from: PRD_PickMtrl,      to: PRD_Instock,       zh: 生产领料单→生产入库单, verified: suspect,
     note: "金蝶标准链路中生产入库单由 PRD_MO 下推；本条需在目标账套实证，见 docs/ontology/model/links.yml:L-2"}

# ── 规则：可在发请求前求值的前置条件（审计 MISS-01..03）──────────
rules:
  - id: PRE-01
    kind: precondition
    zh: 动词必须在名词的 allowed_verbs 内
    enforced_by: base.ontology.check_verb_applies
  - id: PRE-02
    kind: precondition
    zh: 下推的 (from,to) 必须是已登记的链接
    enforced_by: base.ontology.check_link
  - id: PRE-03
    kind: precondition
    zh: 动词的 requires_state 必须被满足（需先读取当前状态）
    enforced_by: base.ontology.check_state
    note: 未提供 current_state 时降级为警告，不阻断——避免为校验而强制多一次查询。
