# 本体注册表 —— MCP 底座的唯一事实来源（machine-readable）
#
# 由 base/gen_registry.py 从 FORM_CATALOG 生成骨架后人工补全契约字段。
# 底座的 6 个通用工具全部由本文件驱动：新增一个名词/链接只改这里，不加工具。

version: 1

# ── 动词：契约是一等公民（审计 A-2 的对症设计）──────────────
verbs:
  query:
    zh: 查询
    kind: read
    arity: batch                 # single | batch
    atomicity: atomic            # atomic | per_item | server_defined
    idempotent: true
    inverse: null                # 只读，无逆动词概念

  read:
    zh: 查看单据详情
    kind: read
    arity: single
    atomicity: atomic
    idempotent: true
    inverse: null                # 只读，无逆动词概念

  save:
    zh: 新建或修改
    kind: write
    endpoint: save
    arity: single
    atomicity: atomic
    idempotent: false
    inverse: delete              # 新建的逆是删除；修改无真正的逆（旧值不留存）
    requires_state: ['NONEXISTENT', 'Z:暂存', 'A:创建']

  submit:
    zh: 提交
    kind: write
    endpoint: submit
    arity: batch
    atomicity: per_item
    idempotent: false
    inverse: cancel              # 撤销（CancelAssign）把已提交单退回
    requires_state: ['Z:暂存', 'A:创建']
    to_state: 'B:审核中'

  audit:
    zh: 审核
    kind: write
    endpoint: audit
    arity: batch                 # single | batch
    atomicity: per_item          # atomic | per_item | server_defined
    idempotent: false
    inverse: unaudit
    requires_state: ['B:审核中']
    to_state: 'C:已审核'

  unaudit:
    zh: 反审核
    kind: write
    endpoint: unaudit
    arity: batch                 # single | batch
    atomicity: per_item          # atomic | per_item | server_defined
    idempotent: false
    inverse: audit
    requires_state: ['C:已审核']
    to_state: 'A:创建'

  delete:
    zh: 删除
    kind: write
    endpoint: delete
    arity: batch                 # single | batch
    atomicity: per_item          # atomic | per_item | server_defined
    idempotent: false
    inverse: null                # 无逆动词 = destructive，调用前需确认
    requires_state: ['Z:暂存', 'A:创建']
    to_state: 'DELETED'

  cancel:
    zh: 撤销
    kind: write
    endpoint: cancel_assign
    arity: batch
    atomicity: server_defined
    idempotent: false
    inverse: submit              # 撤销后可重新提交

  void:
    zh: 作废
    kind: write
    endpoint: execute
    arity: batch                 # single | batch
    atomicity: server_defined    # atomic | per_item | server_defined
    idempotent: false
    inverse: null                # 无逆动词 = destructive，调用前需确认
    requires_state: ['C:已审核']
    to_state: 'VOID'

  close:
    zh: 整单关闭
    kind: write
    endpoint: execute
    arity: batch                 # single | batch
    atomicity: server_defined    # atomic | per_item | server_defined
    idempotent: false
    inverse: unclose
    requires_state: ['C:已审核']
    to_state: 'CLOSED'

  unclose:
    zh: 反关闭
    kind: write
    endpoint: execute
    arity: batch                 # single | batch
    atomicity: server_defined    # atomic | per_item | server_defined
    idempotent: false
    inverse: close
    requires_state: ['CLOSED']
    to_state: 'C:已审核'

  forbid:
    zh: 禁用
    kind: write
    endpoint: execute
    arity: batch                 # single | batch
    atomicity: server_defined    # atomic | per_item | server_defined
    idempotent: false
    inverse: enable
    requires_state: ['ENABLED']
    to_state: 'FORBIDDEN'

  enable:
    zh: 启用
    kind: write
    endpoint: execute
    arity: batch                 # single | batch
    atomicity: server_defined    # atomic | per_item | server_defined
    idempotent: false
    inverse: forbid
    requires_state: ['FORBIDDEN']
    to_state: 'ENABLED'

  push:
    zh: 下推
    kind: write
    endpoint: push
    arity: batch                 # single | batch
    atomicity: server_defined    # atomic | per_item | server_defined
    idempotent: false
    inverse: null                # 无逆动词 = destructive，调用前需确认
    requires_state: ['C:已审核']

