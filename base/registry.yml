    default_fields: "FID,FUSERID,FROLEID,FCREATEDATE"
    legacy_tool: kingdee_query_permission_changes

  V_SFA_ApprovalRecord:
    zh: 审批记录视图
    category: view
    alias: [审批记录, 审批流水]
    allowed_verbs: [query]
    default_fields: "FID,FBILLNO,FFORMID,FAPPROVER,FAPPROVEDATE,FRESULT,FOPINION"
    legacy_tool: kingdee_query_approval_flow

  Workflow_Instance:
    zh: 工作流实例
    category: view
    alias: [工作流实例, 审批实例]
    allowed_verbs: [query]
    default_fields: "FID,FBILLNO,FFORMID,FSTATE,FCREATEDATE"
    legacy_tool: kingdee_query_approval_flow
    # 注：审计 R-7 指出 kingdee_workflow_reject 走 unaudit 端点会**绕过工作流引擎**，
    #     该表不会被更新。要确认审批实例的真实状态，查这张表而不是单据状态。


  SAGA_Run:
    zh: 操作运行
    category: view                 # 由系统产生，不接受写动词——只能看
    alias: [操作运行, 扳机组运行, saga]
    allowed_verbs: [query, read]
    default_fields: "run_id,operation,state,cursor,total_steps,updated_at"
    note: >
      多扣扳机组的一次运行。把它登记成名词，是为了让「态势可被感知」——
      运行状态走的是和单据同一套机制（状态轨道、检索、卡片），
      而不是另起一套只有工程师看得懂的枚举。

# ── 单据编号前缀（启发式，用于「这张单是什么单」）──────────────
#
# ⚠️ 编号前缀由金蝶的**编码规则**决定，是租户可配的（见名词 SYS_NumberRule）。
#    所以这张表是**启发式**，不是铁律：命中只说明"很可能是"，
#    没命中也不说明"不是"。各家改了编码规则就在 profile 里覆盖本段。
#
# evidence 记出处——每条都来自本仓库里真实出现过的单据号，不是编的。
bill_prefixes:
  CGDD:  {form_id: PUR_PurchaseOrder, evidence: "examples/push-stock-in.md；且 FBillTypeID=CGDD01_SYS"}
  CGRK:  {form_id: STK_InStock,       evidence: "examples/procurement-query.md"}
  CGRKD: {form_id: STK_InStock,       evidence: "examples/procurement-audit.md"}
  RKD:   {form_id: STK_InStock,       evidence: "examples/production-mgmt.md 的 target_bill_nos"}
  XSDD:  {form_id: SAL_SaleOrder,     evidence: "examples/workflow-approve.md"}
  XSCKD: {form_id: SAL_OUTSTOCK,      evidence: "examples/push-stock-in.md 的 target_bill_nos"}
  XSBJD: {form_id: SAL_Quotation,     evidence: "docs/mcp_optimization_notes.md；且 FBillTypeID=XSBJD01_SYS"}
  MO:    {form_id: PRD_MO,            evidence: "examples/production-mgmt.md"}
  LLD:   {form_id: PRD_PickMtrl,      evidence: "examples/production-mgmt.md"}
  SCRK:  {form_id: PRD_Instock,       evidence: "tests/e2e/test_production_workflow.py"}
  DB:    {form_id: STK_TransferDirect, evidence: "examples/stock-transfer.md"}
  IQC:   {form_id: QIS_InspectBill,   evidence: "examples/quality-inspection.md"}
  RFQ:   {form_id: SVM_InquiryBill,   evidence: "examples/purchase-inquiry.md"}

# ── 状态：唯一权威词表（审计 S-1 / S-2 的对症设计）──────────────
# 此前 DOC_LIFECYCLE 用中文名、SQL 过滤用字母码，两套互不映射；
# 且 'D' 同时被划入 pending 与 rejected。这里统一为规范码。
states:
  "NONEXISTENT": {zh: 不存在,   field: null,             value: null, terminal: false}
  "Z:暂存":      {zh: 暂存,     field: FDocumentStatus,  value: Z,    terminal: false}
  "A:创建":      {zh: 创建,     field: FDocumentStatus,  value: A,    terminal: false}
  "B:审核中":    {zh: 审核中,   field: FDocumentStatus,  value: B,    terminal: false}
  "C:已审核":    {zh: 已审核,   field: FDocumentStatus,  value: C,    terminal: true}
  "D:重新审核":  {zh: 重新审核, field: FDocumentStatus,  value: D,    terminal: false}
  "CLOSED":      {zh: 已关闭,   field: FCloseStatus,     value: null, terminal: false}
  "VOID":        {zh: 已作废,   field: FCancelStatus,    value: null, terminal: true}
  "DELETED":     {zh: 已删除,   field: null,             value: null, terminal: true}
  "ENABLED":     {zh: 已启用,   field: FForbidStatus,    value: A,    terminal: false}
  "FORBIDDEN":   {zh: 已禁用,   field: FForbidStatus,    value: B,    terminal: false}

  # ── 多扣扳机组运行的状态（对象 SAGA_Run）──────────────────
  # 单独一组，因为它们描述的是「一次运行」而不是「一张单据」。
  # 登记在这里，态势就能被同一套机制感知：状态轨道、检索、对象卡片。
  "SAGA:pending":       {zh: 待开始,   field: state, value: pending,       terminal: false}
  "SAGA:awaiting_auth": {zh: 等待授权, field: state, value: awaiting_auth, terminal: false,
                         note: 最容易被忘掉的状态——放着不管，已生效的写操作就成了无人认领的中间态}
  "SAGA:running":       {zh: 执行中,   field: state, value: running,       terminal: false}
  "SAGA:done":          {zh: 已完成,   field: state, value: done,          terminal: true}
  "SAGA:compensating":  {zh: 补偿中,   field: state, value: compensating,  terminal: false}
  "SAGA:compensated":   {zh: 已补偿,   field: state, value: compensated,   terminal: true,
                         note: 失败了但按逆序退干净了，没有遗留}
  "SAGA:halted":        {zh: 已停止,   field: state, value: halted,        terminal: true,
                         note: 停了且有东西没退掉——需要人决定续做还是清理}
  "SAGA:compensation_failed":
                        {zh: 补偿失败, field: state, value: compensation_failed, terminal: true,
                         note: 最坏的终态。系统试图收拾却没收拾干净，必须人工处理}

# 状态语义分组：修正 S-2（'D' 曾同时属于 pending 与 rejected 两个互斥类）
state_groups:
  pending:  ["A:创建", "B:审核中", "D:重新审核"]   # 待处理：含被打回需重新审核的
  approved: ["C:已审核"]
  draft:    ["Z:暂存"]
  # rejected 不是单据状态——工作流驳回要查审批实例，不能用 FDocumentStatus 表达。
  # 旧代码把 rejected 定义为 D，与 pending 重叠，任何基于它的统计都不可信。
  rejected: null

# ── 链接：可校验的下推关系表（审计 L-1 / MISS-02 的对症设计）─────
# verified: confirmed（已实证）| documented（仅文档记载）| suspect（存疑，见 links.yml L-2）
links:
  - {from: SAL_SaleOrder,     to: SAL_OUTSTOCK,      zh: 销售订单→销售出库单,   verified: documented}
  - {from: SAL_SaleOrder,     to: SAL_RETURNSTOCK,   zh: 销售订单→销售退货单,   verified: documented}
  - {from: SAL_SaleOrder,     to: TRNV_Receipt,      zh: 销售订单→收款单(二开), verified: documented}
  - {from: PUR_PurchaseOrder, to: STK_InStock,       zh: 采购订单→采购入库单,   verified: documented}
  - {from: PUR_PurchaseOrder, to: PUR_ReceiveBill,   zh: 采购订单→收料通知单,   verified: documented}
  - {from: PUR_PurchaseOrder, to: TRNV_PaymentSlip,  zh: 采购订单→付款单(二开), verified: documented}
  - {from: STK_TransferApply, to: STK_TransferDirect, zh: 调拨申请单→直接调拨单, verified: documented}
  - {from: PRD_MO,            to: PRD_PickMtrl,      zh: 生产订单→生产领料单,   verified: documented}
  - {from: PRD_PickMtrl,      to: PRD_Instock,       zh: 生产领料单→生产入库单, verified: suspect,
     note: "金蝶标准链路中生产入库单由 PRD_MO 下推；本条需在目标账套实证，见 docs/ontology/model/links.yml:L-2"}

# ── 规则：可在发请求前求值的前置条件（审计 MISS-01..03）──────────
rules:
  - id: PRE-01
    kind: precondition
    zh: 动词必须在名词的 allowed_verbs 内
    enforced_by: base.ontology.check_verb_applies
    decided_by: aip.logic.verb_applies
  - id: PRE-02
    kind: precondition
    zh: 下推的 (from,to) 必须是已登记的链接
    enforced_by: base.ontology.check_link
    decided_by: aip.logic.link_registered
  - id: SAGA-01
    kind: precondition
    zh: 写步骤之前必须先过守卫（有『检查』步骤时）
    enforced_by: saga.engine.SagaEngine.advance
    note: 没有守卫的顺序执行只是盲发，失败时才发现前提早就不成立
  - id: SAGA-02
    kind: precondition
    zh: 标了『授权』的子任务必须逐步取得记名授权，整体确认一次不覆盖它
    enforced_by: saga.engine.SagaEngine.authorize
    note: 「生成开票申请」和「过账应收」的风险不同，凭什么一次确认覆盖两者
  - id: SAGA-03
    kind: postcondition
    zh: 任一步失败时，已生效的写步骤按逆序补偿；补偿动作不得靠推断
    enforced_by: saga.engine.SagaEngine.compensate
    decided_by: aip.logic.step_compensable
    note: >
      补偿默认取动词的 compensation 字段；profile 可覆盖但不得与本体矛盾。
      没有 compensation 的动词（delete/void）失败后只报告遗留，不猜怎么收拾。
  - id: PRE-03
    kind: precondition
    zh: 动词的 requires_state 必须被满足（需先读取当前状态）
    enforced_by: base.ontology.check_state
    decided_by: aip.logic.state_satisfied
    note: 未提供 current_state 时降级为警告，不阻断——避免为校验而强制多一次查询。
  # ── 判断层自有的规则：不是前置拦截，是「做之前该知道的事」 ──
  - id: AIP-04
    kind: advisory
    zh: 没有逆动词的写动作，执行前必须有人点头
    enforced_by: base.dispatch.Dispatcher.act
    decided_by: aip.logic.irreversible
    note: >
      inverse 与 compensation 是两回事：push 没有逆动词（不存在 unpush），
      但产物可以 delete 掉。这条只看**这个对象本身**能不能退回去。
  - id: AIP-05
    kind: advisory
    zh: 走金蝶「操作」接口的动词，二开单常需显式操作编码
    enforced_by: base.dispatch.Dispatcher.act
    decided_by: aip.logic.needs_operation_code
    note: >
      不阻断——多数标准单用默认值能过。但这是二开环境里最常见的一类
      「参数都对却报错」，事前一句提醒远好过事后翻日志。
