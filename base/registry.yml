# 本体注册表 —— MCP 底座的唯一事实来源（machine-readable）
#
# 由 base/gen_registry.py 从 FORM_CATALOG 生成骨架后人工补全契约字段。
# 底座的 6 个通用工具全部由本文件驱动：新增一个名词/链接只改这里，不加工具。

version: 1

# ── 动词：契约是一等公民（审计 A-2 的对症设计）──────────────
#
# ⚠️ inverse 与 compensation 是**两个概念**，不要混用：
#
#   inverse       把**同一个对象**退回上一状态。audit 的逆是 unaudit——
#                 还是那张单，状态退回去。
#   compensation  把**这一步的产物**清理掉。push 没有逆动词（不存在 unpush），
#                 但它的补偿是 delete——删掉新生成的那张下游单。
#                 对象都不是同一个，所以不能拿 inverse 顶替。
#
# compensation_target 说明补偿作用在谁身上：
#   self      这一步操作的对象（submit/audit/save）
#   produced  这一步生成的对象（push）
#   null      真的退不回来（delete/void）——做了就没了，只能在事前拦
#
# Saga 的 `补偿:` 默认取这里的值；profile 只在需要覆盖时才写。
verbs:
  query:
    zh: 查询
    kind: read
    arity: batch                 # single | batch
    atomicity: atomic            # atomic | per_item | server_defined
    idempotent: true
    inverse: null                # 只读，无逆动词概念

  read:
    zh: 查看单据详情
    kind: read
    arity: single
    atomicity: atomic
    idempotent: true
    inverse: null                # 只读，无逆动词概念

  save:
    zh: 新建或修改
    kind: write
    endpoint: save
    arity: single
    atomicity: atomic
    idempotent: false
    inverse: delete              # 新建的逆是删除；修改无真正的逆（旧值不留存）
    requires_state: ['NONEXISTENT', 'Z:暂存', 'A:创建']
    compensation: delete        # 新建的可删；**修改**的退不回旧值——已审核后尤其
    compensation_target: self

  submit:
    zh: 提交
    kind: write
    endpoint: submit
    arity: batch
    atomicity: per_item
    idempotent: false
    inverse: cancel              # 撤销（CancelAssign）把已提交单退回
    requires_state: ['Z:暂存', 'A:创建']
    to_state: 'B:审核中'
    compensation: cancel        # 撤销回可编辑状态
    compensation_target: self

  audit:
    zh: 审核
    kind: write
    endpoint: audit
    arity: batch                 # single | batch
    atomicity: per_item          # atomic | per_item | server_defined
    idempotent: false
    inverse: unaudit
    requires_state: ['B:审核中']
    to_state: 'C:已审核'
    compensation: unaudit        # 反审核。注意已下推的下游单会受影响
    compensation_target: self

  unaudit:
    zh: 反审核
    kind: write
    endpoint: unaudit
    arity: batch                 # single | batch
    atomicity: per_item          # atomic | per_item | server_defined
    idempotent: false
    inverse: audit
    requires_state: ['C:已审核']
    to_state: 'A:创建'
    compensation: audit        # 重新审核回去
    compensation_target: self

  delete:
    zh: 删除
    kind: write
    endpoint: delete
    arity: batch                 # single | batch
    atomicity: per_item          # atomic | per_item | server_defined
    idempotent: false
    inverse: null                # 无逆动词 = destructive，调用前需确认
    requires_state: ['Z:暂存', 'A:创建']
    to_state: 'DELETED'
    compensation: null        # 物理删除，退不回来。只能在事前拦
    compensation_target: null

  cancel:
    zh: 撤销
    kind: write
    endpoint: cancel_assign
    arity: batch
    atomicity: server_defined
    idempotent: false
    inverse: submit              # 撤销后可重新提交
    compensation: submit        # 重新提交
    compensation_target: self

  void:
    zh: 作废
    kind: write
    endpoint: execute
    arity: batch                 # single | batch
    atomicity: server_defined    # atomic | per_item | server_defined
    idempotent: false
    inverse: null                # 无逆动词 = destructive，调用前需确认
    requires_state: ['C:已审核']
    to_state: 'VOID'
    compensation: null        # 作废不可恢复
    compensation_target: null

  close:
    zh: 整单关闭
    kind: write
    endpoint: execute
    arity: batch                 # single | batch
    atomicity: server_defined    # atomic | per_item | server_defined
    idempotent: false
    inverse: unclose
    requires_state: ['C:已审核']
    to_state: 'CLOSED'
    compensation: unclose
    compensation_target: self

  unclose:
    zh: 反关闭
    kind: write
    endpoint: execute
    arity: batch                 # single | batch
    atomicity: server_defined    # atomic | per_item | server_defined
    idempotent: false
    inverse: close
    requires_state: ['CLOSED']
    to_state: 'C:已审核'
    compensation: close
    compensation_target: self

  forbid:
    zh: 禁用
    kind: write
    endpoint: execute
    arity: batch                 # single | batch
    atomicity: server_defined    # atomic | per_item | server_defined
    idempotent: false
    inverse: enable
    requires_state: ['ENABLED']
    to_state: 'FORBIDDEN'
    compensation: enable
    compensation_target: self

  enable:
    zh: 启用
    kind: write
    endpoint: execute
    arity: batch                 # single | batch
    atomicity: server_defined    # atomic | per_item | server_defined
    idempotent: false
    inverse: forbid
    requires_state: ['FORBIDDEN']
    to_state: 'ENABLED'
    compensation: forbid
    compensation_target: self

  push:
    zh: 下推
    kind: write
    endpoint: push
    arity: batch                 # single | batch
    atomicity: server_defined    # atomic | per_item | server_defined
    idempotent: false
    inverse: null                # 无逆动词 = destructive，调用前需确认
    requires_state: ['C:已审核']
    compensation: delete        # 删掉生成的下游单。**不是** unpush——那个动作不存在
    compensation_target: produced

